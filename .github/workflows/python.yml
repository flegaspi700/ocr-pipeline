name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # Ruff pinned so CI formats exactly like the local venv; bump both together.
          pip install pytest ruff==0.17.0
      - name: Run tests
        run: pytest
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
